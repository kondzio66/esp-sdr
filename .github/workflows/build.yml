name: Build ESP32-S3 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Uruchomienie budowania bezpośrednio w oficjalnym kontenerze ESP-IDF
    container:
      image: espressif/idf:v5.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build and merge binaries
        run: |
          . /opt/esp/idf/export.sh
          idf.py -B build-s3 \
                 -DIDF_TARGET=esp32s3 \
                 -DSDKCONFIG=sdkconfig.s3 \
                 -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32s3 \
                 build esptool_py merge_bin

      - name: Upload Merged Binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware-merged
          path: build-s3/merged-firmware.bin
