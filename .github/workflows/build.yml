name: Build ESP32-S3 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Użycie najnowszej tagowanej wersji v4 akcji checkout
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          submodules: 'recursive'

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: 'v5.1'
          target: 'esp32s3'
          path: '.'
          command: |
            idf.py -B build-s3 \
                   -DIDF_TARGET=esp32s3 \
                   -DSDKCONFIG=sdkconfig.s3 \
                   -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32s3 \
                   build esptool_py merge_bin

      - name: Upload Merged Binary Artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: esp32s3-firmware-merged
          path: build-s3/merged-firmware.bin
